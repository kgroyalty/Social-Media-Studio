# Pre-commit hooks for Promura Social.
# Install: pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
# Reference: https://pre-commit.com

default_language_version:
  python: python3.12

repos:
  # Basic hygiene: trailing whitespace, EOF newlines, large files, merge conflicts, etc.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # Ruff: lint + format (replaces black, isort, flake8, pyupgrade, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # mypy is intentionally NOT in pre-commit hooks.
  # Reason: mypy needs the full Django + INSTALLED_APPS dependency tree to load
  # settings during type inference. Replicating that in pre-commit's isolated
  # env makes commits take 60s+ and breaks on every new dependency.
  # mypy still runs in CI (.github/workflows/ci.yml typecheck job) where the
  # real requirements.txt is installed. That is the correct gate.

  # gitleaks: block commits that contain secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # django-check pre-push hook intentionally removed.
  # Reason: hook ran `python manage.py check` on the host Python, but the host
  # may not have `python` (only `python3`) and definitely does not have Django
  # installed (Django lives in the Docker container, not the OS Python).
  # The CI build job runs Django checks implicitly via collectstatic during
  # image build. That is the correct gate. Re-enable here only if every
  # contributor maintains a host-side virtualenv with Django.
