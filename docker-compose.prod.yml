services:
  migrate:
    build: .
    container_name: promura-migrate
    command: python manage.py migrate --noinput
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/promura
    depends_on:
      postgres:
        condition: service_healthy

  app:
    container_name: promura-app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    volumes:
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    container_name: promura-worker
    volumes:
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    container_name: promura-postgres
    restart: unless-stopped

  maintenance:
    build: .
    container_name: promura-maintenance
    command: >
      sh -c "
      while true; do
        echo \"[maintenance] $$(date): Running clearsessions...\"
        python manage.py clearsessions
        echo \"[maintenance] $$(date): Running media cleanup...\"
        python manage.py cleanup_orphaned_media --once --min-age-days 14
        echo \"[maintenance] $$(date): Done. Sleeping 24h.\"
        sleep 86400
      done
      "
    volumes:
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
